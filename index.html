<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>

    <link rel="icon" type="image/png" href="3077215-bandeira-suica-suica-vetor.jpg">


    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h2>CALCULE SEU IMC (Índice de Massa Corporal)</h2>
        <p>Informe os seus dados abaixo:</p>
    

    <!--genero--->
    <section class="form-group">
    <h3 class="label-title">Gênero:</h3>    
    <div class="gender-selector">
        <input type="radio" name="genero" id="woman" class="radio-hidden" checked>
            <label for="woman" class="gender-btn btn-woman">
                <span class="icon">♀</span> Mulher
            </label>

        <input type="radio" name="genero" id="men" class="radio-hidden">
            <label for="men" class="gender-btn btn-men">
            <span class="icon">♂</span> Homem
            </label>
            </div>
    </section>

<!--idade--->
    <section class="form-group">
        <label for="age" class="label-title">Idade:</label>
        <div class="input-wrapper input-error">
            <input type="number" placeholder="Ex: 25" id="age" min="10" max="90" >
            <span class="unit">anos</span>
    </div>
    </section>

<!--altura--->
    <section class="form-group">
        <label for="height" class="label-title">Altura:</label>    
    <div class="input-wrapper input-error">        
        <input type="number" placeholder="Ex: 175" id="height" min="100" max="210">
            <span class="unit">cm</span>
    </div>
    </section>

<!--peso--->
    <section class="form-group">
        <label for="weight" class="label-title">Peso:</label>
    <div class="input-wrapper">
        <input type="number" placeholder="Ex: 60,5" id="weight" min="10" max="150" step="0.5">   
        <span class="unit">kg</span>
        </div>
    </section>


    
<button type="button" class="btn-calculate" id="btn-calcular">
    CALCULAR
</button>

<p id="mensagem"></p>


<section class="resultado">

    <h3>Seu IMC é:</h3>

    <p id="valor-imc">--</p>

    <p id="classificacao"></p>

</section>
</main>


    <script src="script.js"></script>
</body>
</html>
